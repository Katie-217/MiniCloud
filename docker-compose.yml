name: myminicloud

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [cloud-net]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  elearning-web-server:
    <<: *service-defaults
    build: ./elearning-web
    image: ${DOCKERHUB_USERNAME:-katie217}/myminicloud-elearning:${IMAGE_TAG:-local}
    container_name: elearning-web-server
    depends_on:
      firebase-emulator-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 12

  firebase-emulator-server:
    <<: *service-defaults
    build: ./firebase-emulator
    image: ${DOCKERHUB_USERNAME:-katie217}/myminicloud-firebase:${IMAGE_TAG:-local}
    container_name: firebase-emulator-server
    ports: ["127.0.0.1:9099:9099", "127.0.0.1:8180:8180", "127.0.0.1:9199:9199"]
    volumes: ["firebase-data:/data"]
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.js"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 18

  web-frontend-server:
    <<: *service-defaults
    build: ./web-frontend-server
    image: ${DOCKERHUB_USERNAME:-katie217}/myminicloud-web:${IMAGE_TAG:-local}
    container_name: web-frontend-server
    hostname: web-frontend-server
    ports: ["8080:80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6

  web-frontend-server1:
    <<: *service-defaults
    image: ${DOCKERHUB_USERNAME:-katie217}/myminicloud-web:${IMAGE_TAG:-local}
    container_name: web-frontend-server1
    hostname: web-frontend-server1
    depends_on:
      web-frontend-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6

  web-frontend-server2:
    <<: *service-defaults
    image: ${DOCKERHUB_USERNAME:-katie217}/myminicloud-web:${IMAGE_TAG:-local}
    container_name: web-frontend-server2
    hostname: web-frontend-server2
    depends_on:
      web-frontend-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6

  application-backend-server:
    <<: *service-defaults
    build: ./application-backend-server
    image: ${DOCKERHUB_USERNAME:-katie217}/myminicloud-app:${IMAGE_TAG:-local}
    container_name: application-backend-server
    ports: ["8085:8081"]
    environment:
      DB_HOST: relational-database-server
      DB_USER: ${MARIADB_USER:-minicloud}
      DB_PASSWORD: ${MARIADB_PASSWORD:?Run scripts/setup.py}
      OIDC_ISSUER: ${PUBLIC_ORIGIN:-http://localhost}/auth/realms/${OIDC_REALM:-realm_521H0092}
      OIDC_JWKS_URL: http://authentication-identity-server:8080/auth/realms/${OIDC_REALM:-realm_521H0092}/protocol/openid-connect/certs
      OIDC_AUDIENCE: flask-app
    depends_on:
      relational-database-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 6

  relational-database-server:
    <<: *service-defaults
    image: mariadb:11.4
    container_name: relational-database-server
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Run scripts/setup.py}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-minicloud}
      MARIADB_USER: ${MARIADB_USER:-minicloud}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Run scripts/setup.py}
    ports: ["127.0.0.1:3306:3306"]
    volumes:
      - db-data:/var/lib/mysql
      - ./relational-database-server/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  authentication-identity-server:
    <<: *service-defaults
    image: quay.io/keycloak/keycloak:26.1.4
    container_name: authentication-identity-server
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run scripts/setup.py}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
    ports: ["8081:8080"]
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./authentication-identity-server/healthcheck.sh:/opt/keycloak/healthcheck.sh:ro
    healthcheck:
      test: ["CMD", "bash", "/opt/keycloak/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  object-storage-server:
    <<: *service-defaults
    build: ./object-storage-server
    image: ${DOCKERHUB_USERNAME:-katie217}/myminicloud-minio:source-2025-04-22
    container_name: object-storage-server
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minicloudadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run scripts/setup.py}
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  internal-dns-server:
    <<: *service-defaults
    image: internetsystemsconsortium/bind9:9.18
    container_name: internal-dns-server
    ports: ["1053:53/udp", "1053:53/tcp"]
    volumes:
      - ./internal-dns-server/named.conf:/etc/bind/named.conf:ro
      - ./internal-dns-server/named.conf.options:/etc/bind/named.conf.options:ro
      - ./internal-dns-server/named.conf.local:/etc/bind/named.conf.local:ro
      - ./internal-dns-server/db.cloud.local:/etc/bind/db.cloud.local:ro
    healthcheck:
      test: ["CMD", "named-checkconf", "/etc/bind/named.conf"]
      interval: 15s
      timeout: 5s
      retries: 6

  monitoring-node-exporter-server:
    <<: *service-defaults
    image: prom/node-exporter:v1.9.1
    container_name: monitoring-node-exporter-server
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($$|/)
    pid: host
    ports: ["127.0.0.1:9100:9100"]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9100/metrics"]
      interval: 15s
      timeout: 5s
      retries: 6

  monitoring-web-exporter-server:
    <<: *service-defaults
    image: nginx/nginx-prometheus-exporter:1.4.1
    container_name: monitoring-web-exporter-server
    command: ["--nginx.scrape-uri=http://web-frontend-server:80/stub_status"]
    depends_on:
      web-frontend-server:
        condition: service_healthy

  monitoring-prometheus-server:
    <<: *service-defaults
    image: prom/prometheus:v3.2.1
    container_name: monitoring-prometheus-server
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d"]
    ports: ["9090:9090"]
    volumes:
      - ./monitoring-prometheus-server/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      monitoring-node-exporter-server:
        condition: service_healthy
      monitoring-web-exporter-server:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 6

  monitoring-grafana-dashboard-server:
    <<: *service-defaults
    image: grafana/grafana:11.6.0
    container_name: monitoring-grafana-dashboard-server
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run scripts/setup.py}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["3000:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring-grafana-dashboard-server/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring-grafana-dashboard-server/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      monitoring-prometheus-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  api-gateway-proxy-server:
    <<: *service-defaults
    image: nginx:1.28-alpine
    container_name: api-gateway-proxy-server
    ports: ["80:80"]
    volumes:
      - ./api-gateway-proxy-server/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web-frontend-server:
        condition: service_healthy
      web-frontend-server1:
        condition: service_healthy
      web-frontend-server2:
        condition: service_healthy
      application-backend-server:
        condition: service_healthy
      authentication-identity-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  firebase-data:
  db-data:
  keycloak-data:
  minio-data:
  prometheus-data:
  grafana-data:

networks:
  cloud-net:
    name: cloud-net
    driver: bridge
