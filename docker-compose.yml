name: myminicloud

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [cloud-net]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  web-frontend-server:
    <<: *service-defaults
    build: ./web-frontend-server
    image: ${DOCKERHUB_USERNAME:-katie217}/myminicloud-web:${IMAGE_TAG:-local}
    container_name: web-frontend-server
    ports: ["8080:80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6

networks:
  cloud-net:
    name: cloud-net
    driver: bridge
